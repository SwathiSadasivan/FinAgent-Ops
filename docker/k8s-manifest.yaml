apiVersion: apps/v1
kind: Deployment
metadata:
  name: finagent-api
  labels:
    app: finagent-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finagent-api
  template:
    metadata:
      labels:
        app: finagent-api
    spec:
      containers:
      - name: api
        image: mycontainerregistry.azurecr.io/finagent-api:latest
        ports:
        - containerPort: 8002
        env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: google-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: finagent-api-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8002
  selector:
    app: finagent-api